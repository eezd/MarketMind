name: MarketMind checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: marketmind_ci_verify
          POSTGRES_USER: marketmind_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketmind_ci -d marketmind_ci_verify"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MM_DATABASE_URL: postgresql+psycopg://marketmind_ci:isolated-ci-only@127.0.0.1:5432/marketmind_ci_verify
      MM_TEST_DATABASE_URL: postgresql+psycopg://marketmind_ci:isolated-ci-only@127.0.0.1:5432/marketmind_ci_verify
      MM_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.8
          uv sync --project backend --locked
          npm --prefix frontend ci
          uv run --project backend playwright install --with-deps chromium
      - name: Check code and build frontend
        run: make check
      - name: Migrate isolated database and verify contracts
        run: |
          uv run --project backend alembic -c backend/alembic.ini upgrade head
          uv run --project backend alembic -c backend/alembic.ini check
          uv run --project backend pytest backend/tests -q
      - name: Build local images without publishing
        run: |
          docker build -t marketmind-backend:ci backend
          docker build -t marketmind-web:ci frontend
