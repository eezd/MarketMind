name: marketmind-development

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: marketmind_dev
      POSTGRES_USER: marketmind_dev
      POSTGRES_PASSWORD: ${MM_DEV_DATABASE_PASSWORD:?Set an isolated development password}
    ports:
      - "127.0.0.1:${MM_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-development:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind_dev -d marketmind_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${MM_DEV_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-development:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-development:
  redis-development:
